name: revision-app-dev

# Dev: run ONLY Postgres in Docker; backend (cargo run) and frontend (pnpm dev)
# run natively on the host for fast iteration.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-revision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revision-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-revision}
    ports:
      # Host 5433 to avoid colliding with a Postgres already installed on the
      # machine (default 5432). Keep DATABASE_URL in .env on localhost:5433.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revision} -d ${POSTGRES_DB:-revision}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_dev:
