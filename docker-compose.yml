name: revision-app

# Tout a une valeur par défaut : `docker compose up -d` fonctionne sans .env.
# La clé IA se configure ensuite depuis l'interface (page Réglages) — pas
# besoin de toucher à ce fichier ni au .env pour démarrer.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-revision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revision-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-revision}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host — only the app needs it, over the docker net.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revision} -d ${POSTGRES_DB:-revision}"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks: [revision_net]

  backend:
    image: ghcr.io/tristanpls/revision-app-backend:${APP_VERSION:-latest}
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-revision}:${POSTGRES_PASSWORD:-revision-local-only}@postgres:5432/${POSTGRES_DB:-revision}
      BACKEND_PORT: "8080"
      # Optionnel — la clé IA se configure dans l'UI (Réglages). Ces variables
      # ne servent que de valeurs initiales / overrides avancés.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      FSRS_RETENTION: ${FSRS_RETENTION:-}
      TZ: ${TZ:-Europe/Paris}
      RUST_LOG: ${RUST_LOG:-info}
    expose:
      - "8080"
    # Permet d'atteindre un Ollama/LM Studio tournant sur la machine hôte via
    # http://host.docker.internal:11434/v1 (y compris sous Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    networks: [revision_net]

  frontend:
    image: ghcr.io/tristanpls/revision-app-frontend:${APP_VERSION:-latest}
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # consumed by next.config rewrites to reach the backend over the docker net
      BACKEND_INTERNAL_URL: http://backend:8080
      PORT: "3000"
      NODE_ENV: production
      TZ: ${TZ:-Europe/Paris}
    # Par défaut, seul le frontend est publié, et uniquement en local
    # (127.0.0.1). Pour y accéder depuis un autre appareil du réseau local :
    # BIND_ADDR=0.0.0.0 — mais lis d'abord l'encadré Sécurité du README
    # (application sans authentification).
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    networks: [revision_net]

volumes:
  pgdata:
    driver: local

networks:
  revision_net:
    driver: bridge
